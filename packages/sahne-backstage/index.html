<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahne backstage</title>
<meta name="robots" content="noindex">
<style>
@font-face { font-family: "Comic Neue"; font-weight: 400; font-display: swap; src: url(/fonts/comic-neue-400.woff2) format("woff2"); }
@font-face { font-family: "Comic Neue"; font-weight: 700; font-display: swap; src: url(/fonts/comic-neue-700.woff2) format("woff2"); }
/* tokens: paper and ink, a stage-curtain red for the accent of the stage, a green for go (saved, approved, primary) */
:root {
  --bg: #f4efe6; --panel: #fffdf8; --raised: #ffffff; --ink: #1f1b17; --mute: #6f665c; --faint: #9a8f82; --line: #e3dbcd; --chip: #efe7da;
  --accent: #2f6f5e; --accent-ink: #fff; --accent-soft: #2f6f5e1a; --curtain: #a3372c; --curtain-soft: #a3372c14;
  --bad: #b3261e; --warn: #9a6200; --ok: #2f6f5e; --new: #fde7c4; --focus: #2f6f5e44;
  --ghost: #8a8073; --suggest: #9a6200; --set: #1f1b17;
  --shadow: 0 1px 2px #0000000f, 0 8px 24px #00000014; --radius: 10px;
  --script: "Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161412; --panel: #1f1c19; --raised: #27231f; --ink: #f1ebe2; --mute: #a89e92; --faint: #7a7166; --line: #38322c; --chip: #2c2723; --accent: #6fbfa6; --accent-ink: #0f201b; --accent-soft: #6fbfa61f; --curtain: #e07a6c; --curtain-soft: #e07a6c1a; --bad: #ff8a80; --warn: #f0b860; --ok: #6fbfa6; --new: #4a3a1c; --focus: #6fbfa655; --ghost: #8f867a; --suggest: #f0b860; --set: #f1ebe2; --shadow: 0 1px 2px #0006, 0 8px 24px #0008; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #161412; --panel: #1f1c19; --raised: #27231f; --ink: #f1ebe2; --mute: #a89e92; --faint: #7a7166; --line: #38322c; --chip: #2c2723; --accent: #6fbfa6; --accent-ink: #0f201b; --accent-soft: #6fbfa61f; --curtain: #e07a6c; --curtain-soft: #e07a6c1a; --bad: #ff8a80; --warn: #f0b860; --ok: #6fbfa6; --new: #4a3a1c; --focus: #6fbfa655; --ghost: #8f867a; --suggest: #f0b860; --set: #f1ebe2; --shadow: 0 1px 2px #0006, 0 8px 24px #0008; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
button, select, input, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
button.small { padding: 2px 8px; font-size: 13px; }
input, select, textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 8px; width: 100%; }
textarea { resize: vertical; min-height: 2.4em; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 0; border-color: var(--accent); }
[dir="rtl"] { text-align: right; }
h2 { font-size: 22px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 16px 0 6px; }
.note { color: var(--mute); font-size: 13.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-size: 12.5px; }
.chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); } .chip.ok { color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-decoration: none; color: var(--ink); }
.card:hover { border-color: var(--accent); }
.card b { display: block; }
.card small { color: var(--mute); display: block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.fields { display: grid; gap: 8px; }
.field label { display: block; font-size: 12.5px; color: var(--mute); margin-bottom: 2px; }
.field.changed label::after { content: " • changed"; color: var(--warn); }
.tri { display: grid; grid-template-columns: 1fr; gap: 6px; }
.toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.notice { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 50; max-width: 80vw; }
.notice.bad { background: var(--bad); color: #fff; }
.episode { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
.stagebox { position: relative; width: 100%; aspect-ratio: 16 / 10; background: #000; border-radius: 10px; overflow: hidden; }
.stagebox > * { position: absolute; inset: 0; }
.pins { pointer-events: none; }
.pins span { position: absolute; transform: translate(-50%, -100%); font-size: 11px; background: var(--accent); color: var(--accent-ink); padding: 0 5px; border-radius: 4px; white-space: nowrap; pointer-events: auto; cursor: pointer; }
.pins span.hit { background: var(--warn); }
.transport { display: grid; gap: 6px; margin-top: 8px; }
.transport input[type=range] { padding: 0; }
.steps { max-height: 62vh; overflow: auto; padding: 0; margin: 0; list-style: none; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.steps li { padding: 4px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; font-size: 14px; }
.steps li.sub { padding-left: 34px; font-size: 13.5px; }
.steps li.subsub { padding-left: 58px; font-size: 13px; }
.steps li[aria-selected="true"] { background: var(--chip); }
.steps li.playing .n { color: var(--accent); font-weight: 700; }
.steps li.changed { box-shadow: inset 3px 0 var(--warn); }
.steps .n { color: var(--mute); font-variant-numeric: tabular-nums; }
.steps .who { font-weight: 600; margin-right: 4px; }
.steps .kind { color: var(--mute); font-size: 12px; margin-right: 4px; }
.problems { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
.problems li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
.problems li.error { color: var(--bad); } .problems li.warning { color: var(--warn); } .problems li.info { color: var(--mute); }
.problems li.new { background: var(--new); }
.footcard { display: grid; gap: 6px; }
.footcard button { text-align: left; }
.diff del { background: #f4c7c3; color: #5a1410; text-decoration: line-through; }
.diff ins { background: #c9ecd9; color: #0c3b25; text-decoration: none; }
table.grid { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.grid td, table.grid th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
details > summary { cursor: pointer; color: var(--mute); }
pre.json { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; margin: 0; }
.portrait svg { width: 100%; height: auto; display: block; }
.card .portrait { width: 110px; margin: 0 auto 4px; }
/* ---- the studio shell: a top bar, a rail, the page, a drawer */
.studio { display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 64px minmax(0, 1fr) auto; grid-template-areas: "top top top" "rail page drawer"; height: 100vh; }
.topbar { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.topbar .brand svg { color: var(--curtain); }
.topbar .series { color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22vw; }
.topbar .seasons { display: flex; gap: 2px; }
.topbar .seasons a { padding: 4px 10px; border-radius: 99px; text-decoration: none; color: var(--mute); font-size: 13.5px; }
.topbar .seasons a[aria-current] { background: var(--chip); color: var(--ink); font-weight: 600; }
.topbar .search { flex: 1; max-width: 460px; margin: 0 auto; display: flex; align-items: center; gap: 8px; color: var(--mute); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: text; text-align: left; }
.topbar .search kbd { margin-left: auto; }
.topbar .state { font-size: 13px; color: var(--mute); white-space: nowrap; }
.topbar .state.dirty { color: var(--warn); }
.topbar .state.ro { color: var(--curtain); }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--mute); }
.iconbtn:hover:not(:disabled) { background: var(--chip); color: var(--ink); border-color: transparent; }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
kbd { font: 11.5px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--mute); background: var(--panel); }
.rail { grid-area: rail; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
.rail a { display: grid; justify-items: center; gap: 2px; width: 54px; padding: 7px 0 5px; border-radius: 10px; text-decoration: none; color: var(--mute); font-size: 10.5px; }
.rail a:hover { background: var(--chip); color: var(--ink); }
.rail a[aria-current] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail .spacer { flex: 1; }
.page { grid-area: page; overflow: auto; min-width: 0; }
.page > main { padding: 18px 22px 60px; }
.drawer { grid-area: drawer; width: min(420px, 92vw); border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.drawer > header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.drawer > header b { flex: 1; }
.drawer > .body { flex: 1; overflow: auto; padding: 12px; }
/* the palette */
.scrim { position: fixed; inset: 0; background: #0000004d; z-index: 60; display: grid; place-items: start center; padding-top: 12vh; }
.palette { width: min(620px, 92vw); background: var(--raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.palette input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 16px; font-size: 16px; background: none; }
.palette input:focus { outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.palette li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.palette li[aria-selected="true"] { background: var(--accent-soft); }
.palette li .what { color: var(--faint); font-size: 12px; min-width: 64px; }
.palette li .hint { margin-left: auto; color: var(--faint); font-size: 12.5px; }
/* popovers and menus */
.popover { position: fixed; z-index: 55; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; max-width: min(420px, 92vw); max-height: 70vh; overflow: auto; }
.empty { display: grid; place-items: center; gap: 8px; padding: 40px 16px; text-align: center; color: var(--mute); border: 1.5px dashed var(--line); border-radius: var(--radius); }
.lang-tag { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.banner { background: var(--curtain-soft); color: var(--ink); border-bottom: 1px solid var(--line); padding: 8px 22px; font-size: 13.5px; }
.texts { display: grid; gap: 3px; }
.texts-label { font-size: 12.5px; color: var(--mute); }
.text-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; align-items: center; }
.text-row .lang-tag { text-align: right; }
.text-row input, .text-row textarea { font-size: 13.5px; padding: 3px 7px; }
.text-row.main input, .text-row.main textarea { font-size: 15.5px; padding: 6px 9px; }
.text-row.changed .lang-tag { color: var(--warn); }
.text-row .missing { color: var(--warn); font-weight: 700; width: 8px; }
/* galleries: the kit as cards */
.gallery { display: grid; gap: 10px; }
.gallery-bar { display: grid; gap: 6px; }
.gallery-bar .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.gallery-bar .chip { border: 1px solid transparent; cursor: pointer; }
.gallery-bar .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.gallery .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.gallery.s .grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.gallery.l .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.tile { position: relative; display: grid; gap: 2px; align-content: start; text-align: left; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); text-decoration: none; cursor: pointer; font: inherit; }
.tile:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.tile.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.tile.faded { opacity: .55; }
.tile b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile small { color: var(--mute); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .art { aspect-ratio: 16 / 10; display: grid; place-items: center; overflow: hidden; border-radius: 7px; background: var(--chip); color: var(--mute); margin-bottom: 4px; }
.gallery.s .tile { padding: 5px; } .gallery.s .tile b { font-size: 12px; } .gallery.s .tile small { display: none; }
.gallery.s .tile .art { aspect-ratio: 1; }
.tile .art svg, .tile .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .art.blank { font-size: 26px; font-weight: 700; }
.tile .tick { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 6px 0 12px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--mute); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.pagehead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.pagehead h2 { margin: 0; }
.pagehead .grow { flex: 1; }
/* the board: weeks by days */
.board { display: grid; gap: 6px; min-width: 820px; }
.board-page { overflow-x: auto; }
.board-head, .board-row { display: grid; grid-template-columns: 160px repeat(6, minmax(110px, 1fr)); gap: 6px; }
.board-head span { font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; padding: 0 4px; }
.board-row .week { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 8px; display: grid; gap: 4px; align-content: start; }
.board-row .week b { font-size: 13.5px; } .board-row .week small { color: var(--faint); font-size: 11.5px; }
.board-row .week .theme { font-size: 13px; padding: 3px 6px; border-style: dashed; }
.board-row .week .theme:not(:placeholder-shown) { border-style: solid; border-color: transparent; background: var(--bg); }
.board-row .week .mech { display: flex; gap: 3px; flex-wrap: wrap; } .board-row .week .mech .chip { font-size: 10.5px; padding: 0 5px; }
.board-row.break { opacity: .55; } .board-row.break .day { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--chip) 6px 7px); }
.board-row.now .week { box-shadow: inset 3px 0 var(--curtain); }
.day { position: relative; min-height: 132px; border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px 4px 4px; display: grid; align-content: stretch; }
.day.special { background: var(--curtain-soft); }
.day.over { border: 2px solid var(--accent); background: var(--accent-soft); }
.day.past .date { text-decoration: line-through; text-decoration-color: var(--faint); }
.day .date { position: absolute; top: 3px; left: 7px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.day .slot { display: grid; place-items: center; align-content: center; gap: 2px; color: var(--faint); text-decoration: none; font-size: 12px; border-radius: 8px; opacity: 0; transition: opacity .12s; }
.day:hover .slot, .day .slot:focus-visible { opacity: 1; background: var(--bg); color: var(--accent); }
.ep-card { display: grid; gap: 1px; align-content: start; background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 5px; text-decoration: none; color: var(--ink); cursor: grab; box-shadow: 0 1px 1px #0000000d; }
.ep-card:hover { border-color: var(--accent); }
.ep-card.approved { border-left: 3px solid var(--ok); } .ep-card.reviewed { border-left: 3px solid var(--mute); } .ep-card.draft { border-left: 3px solid var(--warn); }
.ep-card .art { aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--chip); margin-bottom: 3px; display: grid; place-items: center; color: var(--faint); }
.ep-card .art img { width: 100%; height: 100%; object-fit: cover; }
.ep-card b { font-size: 12.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ep-card small { font-size: 11px; color: var(--faint); }
.ep-card .badges { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; } .ep-card .badges .chip { font-size: 10.5px; padding: 0 5px; }
.savebar .bad-line { display: block; color: var(--bad); }
.tray { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 8px; }
.savebar { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; padding: 10px 12px; margin-top: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); font-size: 13px; color: var(--mute); }
@media (max-width: 760px) { .studio { grid-template-columns: 0 minmax(0, 1fr) 0; } .rail { display: none; } .topbar .series, .topbar .seasons { display: none; } .drawer { position: fixed; inset: 52px 0 0 auto; z-index: 40; } }
@media (max-width: 980px) { .episode { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/dist/app/index.js"></script>
</body>
</html>
