<!doctype html>
<!-- The 0.3 release banner (assets/releases/sahne-0.3.jpg), in the poster's style. Rendered by banner.mjs beside it. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fraunces; font-weight: 700; src: url(../../node_modules/.pnpm/@fontsource+fraunces@5.3.0/node_modules/@fontsource/fraunces/files/fraunces-latin-700-normal.woff2); }
@font-face { font-family: Fraunces; font-weight: 600; font-style: italic; src: url(../../node_modules/.pnpm/@fontsource+fraunces@5.3.0/node_modules/@fontsource/fraunces/files/fraunces-latin-600-italic.woff2); }
@font-face { font-family: Inter; font-weight: 500; src: url(../../node_modules/.pnpm/@fontsource+inter@5.3.0/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); }
@font-face { font-family: Inter; font-weight: 600; src: url(../../node_modules/.pnpm/@fontsource+inter@5.3.0/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1600px; height: 800px; overflow: hidden; }
body { background: #1C2246; color: #FBF3E2; font-family: Inter, sans-serif; position: relative; }
.stars { position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 20px 30px, #ffffff22 50%, transparent 51%), radial-gradient(1px 1px at 140px 90px, #ffffff18 50%, transparent 51%), radial-gradient(1.5px 1.5px at 80px 150px, #ffffff14 50%, transparent 51%); background-size: 180px 180px; }
.left { position: absolute; left: 80px; top: 70px; width: 640px; }
.lockup { height: 64px; display: block; }
h1 { font-family: Fraunces, serif; font-weight: 700; font-size: 132px; line-height: 1; margin-top: 34px; letter-spacing: -1px; }
h1 span { color: #E9A23B; }
.sub { font-family: Fraunces, serif; font-style: italic; font-weight: 600; color: #E9C38B; font-size: 30px; margin-top: 14px; }
.lead { font-size: 33px; font-weight: 600; line-height: 1.25; margin-top: 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 12px 14px; margin-top: 34px; }
.chip { background: #FBF3E2; color: #1C2246; font-weight: 500; font-size: 21px; padding: 10px 18px; border-radius: 6px; box-shadow: 0 3px 0 #0003; }
.chip:nth-child(odd) { transform: rotate(-1deg); } .chip:nth-child(even) { transform: rotate(0.8deg); }
.photo { position: absolute; background: #FBF3E2; padding: 14px 14px 46px; box-shadow: 0 18px 40px #0007; }
.photo img { display: block; width: 100%; }
.photo .cap { position: absolute; left: 18px; bottom: 12px; color: #3a3550; font-size: 19px; font-weight: 500; }
.tape { position: absolute; top: -16px; left: 50%; width: 130px; height: 34px; margin-left: -65px; background: #E9D28Fcc; transform: rotate(-2deg); }
.p1 { left: 830px; top: 60px; width: 650px; transform: rotate(3deg); }
.p2 { left: 760px; top: 250px; width: 760px; transform: rotate(-2deg); }
.voice { position: absolute; display: flex; align-items: center; gap: 10px; background: #FBF3E2; color: #1C2246; border-radius: 999px; padding: 10px 18px 10px 12px; box-shadow: 0 6px 16px #0006; font-size: 20px; font-weight: 600; }
.voice svg { display: block; }
.v1 { left: 1210px; top: 268px; transform: rotate(-2deg); }
.v2 { left: 820px; top: 690px; transform: rotate(1.5deg); }
.wave { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; opacity: 0.9; }
</style></head><body>
<div class="stars"></div>
<div class="left">
  <img class="lockup" src="../brand/sahne-voice-header-dark.svg" alt="">
  <h1>Sahne <span>0.3</span></h1>
  <p class="sub">her karakterin kendi sesi</p>
  <p class="lead">Every character speaks in their own voice, the same in every episode</p>
  <div class="chips">
    <span class="chip">cast in Backstage</span>
    <span class="chip">made on your own machine</span>
    <span class="chip">heard back and checked</span>
    <span class="chip">voices from six languages</span>
    <span class="chip">about 14 kB a line</span>
  </div>
</div>
<div class="photo p1"><span class="tape"></span><img src="../scenes/bakkal.jpg" alt=""></div>
<div class="photo p2"><span class="tape"></span><img src="../scenes/story.jpg" alt=""><span class="cap">a story playing, each line in its speaker's voice</span></div>
<div class="voice v1"><svg id="w1" width="92" height="34"></svg>İsmail Abi</div>
<svg class="wave" id="wave" viewBox="0 0 1600 64" preserveAspectRatio="none"></svg>
<script>
// waveform bars, seeded so the banner is the same every time it is rendered
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
function bars(svg, n, w, h, colours) {
  const gap = w / n; let out = "";
  for (let i = 0; i < n; i++) {
    const env = Math.sin(Math.PI * (i + 0.5) / n) ** 0.6, a = Math.max(0.12, env * (0.35 + 0.65 * rnd())) * h;
    out += `<rect x="${(i * gap + gap * 0.2).toFixed(1)}" y="${((h - a) / 2).toFixed(1)}" width="${(gap * 0.6).toFixed(1)}" height="${a.toFixed(1)}" rx="${(gap * 0.3).toFixed(1)}" fill="${colours[i % colours.length]}"/>`;
  }
  svg.innerHTML = out;
}
bars(document.getElementById("w1"), 14, 92, 34, ["#C2452D"]);
const wave = document.getElementById("wave"); let out = "";
for (let i = 0; i < 200; i++) {
  const a = (0.15 + 0.85 * Math.abs(Math.sin(i / 7) * Math.sin(i / 23 + 1)) * (0.5 + 0.5 * rnd())) * 56;
  out += `<rect x="${i * 8 + 1}" y="${64 - a}" width="5" height="${a}" rx="2.5" fill="${["#C2452D", "#E9A23B", "#3E7A5C", "#1FA5A0", "#9C5F7C"][Math.floor(i / 40) % 5]}" opacity="0.55"/>`;
}
wave.innerHTML = out;
</script>
</body></html>
