name: release

# Off for now. A `v*` tag (or a manual run) does nothing until a maintainer sets the repository variables
# (Settings → Secrets and variables → Actions → Variables):
#   RELEASE_ENABLED = true   the gate runs on the tag, then a GitHub release is made with generated notes
#   PUBLISH_ENABLED = true   after the release, the libraries go to npm (needs the NPM_TOKEN secret)
# Before turning publishing on: drop `"private": true` from sahne, sahne-kit, sahne-tr, sahne-en, sahne-de, sahne-fa and sahne-story, give them
# the tag's version, and decide how the TypeScript source ships (today `exports` points at .ts files). pnpm skips
# every private package, so until then the publish step publishes nothing. sahne-gallery is never published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (it must already exist, e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/sahne-gallery
      - run: sudo apt-get install -y fonts-comic-neue
      - run: pnpm sahne check
      - name: GitHub release
        run: gh release create "$TAG" --verify-tag --generate-notes --title "Sahne $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: release
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: npm publish (the four libraries; private packages are skipped)
        run: pnpm --filter sahne --filter sahne-kit --filter sahne-tr --filter sahne-en --filter sahne-de --filter sahne-fa --filter sahne-story publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
