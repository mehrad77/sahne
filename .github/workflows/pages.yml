name: pages

# The gallery as the live demo, https://sahne.shab.boo: once `ci` passes on main, the gallery is built as a
# static site from the samples (`pnpm sahne build`, packages/sahne-gallery/build.mjs) and deployed to GitHub
# Pages. The custom domain is set in the repo's Pages settings, with a DNS-only CNAME `sahne` → mehrad77.github.io.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm sahne build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/sahne-gallery/dist/site
      - id: deploy
        uses: actions/deploy-pages@v4
