name: Bug
description: Something on stage or in the gallery is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Gallery link
      description: A gallery view's address holds its state (for example http://localhost:5180/#/places/bakkal?time=dusk)
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Mid-cue frames help with acting bugs (node packages/sahne-gallery/shots.mjs --out <dir> --mid)
  - type: input
    id: env
    attributes:
      label: Browser and OS
